000" font-size="14.896" textLength="405.388" font-family="Arial">на ферме действуют кэшированные подписанные версии.</text><text x="513.287" y="206.115" fill="#000" font-size="14.896" textLength="351.318" font-family="Arial">10 потоков — ёмкость после резерва CPU/RAM/IO</text><text x="513.287" y="223.244" fill="#000" font-size="14.896" textLength="359.297" font-family="Arial">для Kafka и доменных процессов, а не весь ресурс.</text><text x="513.287" y="240.373" fill="#000" font-size="14.896" textLength="428.001" font-family="Arial">Мобильный получатель: управляемое устройство дежурного,</text><text x="513.287" y="257.501" fill="#000" font-size="14.896" textLength="457.77" font-family="Arial">WSS к терминалу по ЛВС; работа в фоне проверяется на пилоте.</text></g><!--link cams to video--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="22" data-link-type="dependency"><path d="M230.748,650.591 C323.538,650.591 454.85,650.591 564.311,650.591" style="stroke:#555;stroke-width:1.146;" fill="none" id="cams-to-video"/><polygon points="570.041,650.591,559.728,646.008,564.311,650.591,559.728,655.174,570.041,650.591" fill="#555" style="stroke:#555;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="271.517" y="647.376" fill="#000" font-size="14.896" textLength="193.966" font-family="Arial">RTSP / проводная PoE-ЛВС</text></g><!--link video to term--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="lnk10" data-source-line="23" data-link-type="dependency"><path d="M877.949,673.508 C913.882,680.692 952.76,689.263 988.247,698.716 C1123.157,734.684 1153.866,753.796 1286.164,798.404 C1312.117,807.158 1334.696,814.801 1360.787,823.67" style="stroke:#555;stroke-width:1.146;" fill="none" id="video-to-term"/><polygon points="1366.211,825.514,1357.923,817.856,1360.787,823.67,1354.973,826.535,1366.211,825.514" fill="#555" style="stroke:#555;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><tex