ualified-name=".start." id="ent0004" data-source-line="16"><ellipse cx="18.333" cy="310.634" rx="11.458" ry="11.458" fill="#222" style="stroke:#222;stroke-width:1.146;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0011" data-source-line="22"><ellipse cx="1923.155" cy="348.446" rx="12.604" ry="12.604" fill="none" style="stroke:#222;stroke-width:1.146;"/><ellipse cx="1923.155" cy="348.446" rx="6.875" ry="6.875" fill="#222" style="stroke:#222;stroke-width:1.146;"/></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="24"><path d="M344.896,391.026 L344.896,505.256 A0,0 0 0 0 344.896,505.256 L706.398,505.256 A0,0 0 0 0 706.398,505.256 L706.398,402.484 L694.94,391.026 L530.234,391.026 L525.651,339.715 L521.068,391.026 L344.896,391.026 A0,0 0 0 0 344.896,391.026" style="stroke:#181818;stroke-width:0.573;" fill="#FEFFDD"/><path d="M694.94,391.026 L694.94,402.484 L706.398,402.484 L694.94,391.026" style="stroke:#181818;stroke-width:0.573;" fill="#FEFFDD"/><text x="351.771" y="410.727" fill="#000" font-size="14.896" textLength="337.44" font-family="Arial">Группировка: зона + 60 с от первого occurred_at.</text><text x="351.771" y="427.856" fill="#000" font-size="14.896" textLength="300.906" font-family="Arial">Повтор observation_id не новый подрепорт.</text><text x="351.771" y="444.984" fill="#000" font-size="14.896" textLength="300.106" font-family="Arial">Позднее: доказанная связь — дополнение,</text><text x="351.771" y="462.113" fill="#000" font-size="14.896" textLength="194.504" font-family="Arial">иначе отдельный инцидент.</text><text x="351.771" y="479.242" fill="#000" font-size="14.896" textLength="310.507" font-family="Arial">Первое свежее обнаружение: тревога сразу.</text><text x="351.771" y="496.371" fill="#000" font-size="14.896" textLength="318.849" font-family="Arial">Ручная карточка: оповестить / только журнал.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="32"><path d="M937.853,23